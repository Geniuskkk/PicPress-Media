name: Setup PicPress Build Environment
description: >-
  Common environment setup for PicPress Media CI: Go and Node with cache.
  Platform-specific system dependencies (libvips, dylibbundler, msys2, apt packages)
  are handled by the caller job.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json

    - name: Install Node dependencies (root)
      shell: bash
      run: npm ci --legacy-peer-deps

    - name: Install Node dependencies (frontend workspace)
      shell: bash
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Verify release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
