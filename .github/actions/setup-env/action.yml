name: Setup PicPress Build Environment
description: Install the pinned Node/Go toolchains and the single root dependency tree.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Test packaging helpers
      shell: bash
      run: npm run test:packaging
    - name: Verify release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
