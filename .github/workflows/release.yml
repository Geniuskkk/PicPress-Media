name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────
  # macOS — arm64 only (macos-14, Apple Silicon)
  # macos-13 (Intel) runners are retired by GitHub.
  # Intel Mac users need a separate x64 build; Rosetta only runs x64 apps on Apple Silicon.
  # ────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips and dylibbundler
        run: brew install vips dylibbundler

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar (arm64)
        run: npm run build:go:arm64
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (macOS arm64)
        run: npm run build && npx electron-builder --config electron-builder.config.ts --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CGO_ENABLED: '1'

      - name: Smoke test packaged macOS sidecar
        run: |
          APP="dist/mac-arm64/PicPress Media.app"
          SIDECAR="$APP/Contents/Resources/bin/picpress"
          FFMPEG="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          FFPROBE="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffprobe-static/bin/darwin/arm64/ffprobe"

          test -x "$SIDECAR"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          codesign --verify --verbose=4 "$SIDECAR"
          find "$APP/Contents/Resources/bin" -type f -name "*.dylib" -exec codesign --verify --verbose=4 {} \;

          node - <<'NODE'
          const { spawn } = require('node:child_process')

          const app = 'dist/mac-arm64/PicPress Media.app'
          const sidecar = `${app}/Contents/Resources/bin/picpress`
          const child = spawn(sidecar, [], {
            env: {
              ...process.env,
              PORT: '54321',
              FFMPEG_PATH: `${app}/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg`,
              FFPROBE_PATH: `${app}/Contents/Resources/app.asar.unpacked/node_modules/ffprobe-static/bin/darwin/arm64/ffprobe`,
            },
            stdio: ['ignore', 'pipe', 'pipe'],
          })

          let stderr = ''
          child.stdout.on('data', (data) => process.stdout.write(`[sidecar] ${data}`))
          child.stderr.on('data', (data) => {
            stderr += data.toString()
            process.stderr.write(`[sidecar] ${data}`)
          })

          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          ;(async () => {
            try {
              for (let i = 0; i < 30; i += 1) {
                if (child.exitCode !== null) {
                  throw new Error(`sidecar exited early with code ${child.exitCode}\n${stderr}`)
                }

                try {
                  const res = await fetch('http://127.0.0.1:54321/api/health')
                  if (res.ok) {
                    child.kill('SIGTERM')
                    return
                  }
                } catch {
                  await wait(500)
                }
              }

              throw new Error(`sidecar health check timed out\n${stderr}`)
            } finally {
              if (child.exitCode === null) child.kill('SIGTERM')
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install MinGW64 + libvips via MSYS2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libvips

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add MSYS2 mingw64 to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar (Windows)
        shell: pwsh
        run: npm run build:go
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: '${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\pkgconfig'
          CGO_CFLAGS: '-I${{ steps.msys2.outputs.msys2-location }}\mingw64\include'
          CGO_LDFLAGS: '-L${{ steps.msys2.outputs.msys2-location }}\mingw64\lib'
          CC: 'gcc'
          CXX: 'g++'

      - name: Build Electron (Windows)
        shell: pwsh
        run: npm run build && npx electron-builder --config electron-builder.config.ts --win nsis --publish never
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: '${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\pkgconfig'
          CGO_CFLAGS: '-I${{ steps.msys2.outputs.msys2-location }}\mingw64\include'
          CGO_LDFLAGS: '-L${{ steps.msys2.outputs.msys2-location }}\mingw64\lib'
          CC: 'gcc'
          CXX: 'g++'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: dist/*.exe
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Linux
  # ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips and electron-builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            libnss3-dev \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar
        run: npm run build:go
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (Linux)
        run: npm run build && npx electron-builder --config electron-builder.config.ts --linux AppImage deb --publish never
        env:
          CGO_ENABLED: '1'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicPress Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
