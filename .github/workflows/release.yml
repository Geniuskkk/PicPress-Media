name: Build & Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-env
      - run: brew install vips dylibbundler
      - run: npm run typecheck
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run make -- --platform=darwin --arch=arm64
      - run: npm run smoke:package
      - run: npm run smoke:electron
      - name: Verify bundled signatures
        run: |
          BIN="out/PicPress Media-darwin-arm64/PicPress Media.app/Contents/Resources/bin"
          codesign --verify --verbose=4 "$BIN/picpress"
          find "$BIN" -name '*.dylib' -exec codesign --verify --verbose=4 {} \;
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-dist
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-env
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-libheif
      - name: Configure CGO
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run typecheck
      - run: npm run make -- --platform=win32 --arch=x64
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: win-dist
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-env
      - run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev fakeroot dpkg libnss3 libatk-bridge2.0-0 libgtk-3-0
      - run: npm run typecheck
      - run: npm run make -- --platform=linux --arch=x64 --targets=@electron-forge/maker-deb
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deb-dist
          path: out/make/**/*.deb
          if-no-files-found: error

  # Compile against Fedora's libraries for RPM; do not ship an Ubuntu-linked
  # CGO binary as an RPM with incompatible libvips/glib dependencies.
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 45
    steps:
      - run: dnf install -y git tar gzip findutils gcc gcc-c++ make vips-devel vips-heif pkgconf-pkg-config rpm-build
      - uses: actions/checkout@v7.0.1
      - name: Trust the checked-out repository in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-env
      - run: npm run typecheck
      - run: npm run make -- --platform=linux --arch=x64 --targets=@electron-forge/maker-rpm
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rpm-dist
          path: out/make/**/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win, build-deb, build-rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v3.0.3
        with:
          name: PicPress Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.nupkg
            artifacts/**/RELEASES
            artifacts/**/*.deb
            artifacts/**/*.rpm
