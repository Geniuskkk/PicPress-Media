name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────
  # macOS — arm64 only (macos-14, Apple Silicon)
  # macos-13 (Intel) runners are retired by GitHub.
  # Intel Mac users can run the arm64 build via Rosetta 2.
  # ────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips
        run: brew install vips

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar (arm64)
        run: npm run build:go:arm64
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (macOS arm64)
        run: npm run build && npx electron-builder --mac dmg zip --dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CGO_ENABLED: '1'

      - name: Verify bundled Go sidecar (macOS)
        run: |
          sidecar_path=$(find dist -path '*/Contents/Resources/bin/picpress' -print -quit)
          if [[ -z "$sidecar_path" ]]; then
            echo 'Bundled Go sidecar not found under dist/**/Contents/Resources/bin/picpress' >&2
            exit 1
          fi
          echo "Found sidecar: $sidecar_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install MinGW64 + libvips via MSYS2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libvips

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add MSYS2 mingw64 to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar (Windows)
        shell: pwsh
        run: npm run build:go
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: '${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\pkgconfig'
          CGO_CFLAGS: '-I${{ steps.msys2.outputs.msys2-location }}\mingw64\include'
          CGO_LDFLAGS: '-L${{ steps.msys2.outputs.msys2-location }}\mingw64\lib'
          CC: 'gcc'
          CXX: 'g++'

      - name: Build Electron (Windows)
        shell: pwsh
        run: npm run build && npx electron-builder --win nsis --dir --publish never
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: '${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\pkgconfig'
          CGO_CFLAGS: '-I${{ steps.msys2.outputs.msys2-location }}\mingw64\include'
          CGO_LDFLAGS: '-L${{ steps.msys2.outputs.msys2-location }}\mingw64\lib'
          CC: 'gcc'
          CXX: 'g++'

      - name: Verify bundled Go sidecar (Windows)
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Path dist -Recurse -Filter picpress.exe |
            Where-Object { $_.FullName -match 'resources[\\/]bin[\\/]picpress\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sidecar) {
            throw 'Bundled Go sidecar not found under dist/**/resources/bin/picpress.exe'
          }
          Write-Host "Found sidecar: $sidecar"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: dist/*.exe
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Linux
  # ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips and electron-builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            libnss3-dev \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar
        run: npm run build:go
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (Linux)
        run: npm run build && npx electron-builder --linux AppImage deb --dir --publish never
        env:
          CGO_ENABLED: '1'

      - name: Verify bundled Go sidecar (Linux)
        run: |
          sidecar_path=$(find dist -path '*/resources/bin/picpress' -print -quit)
          if [[ -z "$sidecar_path" ]]; then
            echo 'Bundled Go sidecar not found under dist/**/resources/bin/picpress' >&2
            exit 1
          fi
          echo "Found sidecar: $sidecar_path"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicPress Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
