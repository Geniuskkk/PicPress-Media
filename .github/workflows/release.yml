name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────
  # macOS
  # ────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips
        run: brew install vips

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar
        run: npm run build:go
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (macOS)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install MinGW64 + libvips via MSYS2 (does NOT change default shell)
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libvips

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar (CGO + libvips via MSYS2)
        shell: pwsh
        run: |
          $env:CGO_ENABLED   = "1"
          $env:PKG_CONFIG_PATH = "C:\msys64\mingw64\lib\pkgconfig"
          $env:CGO_CFLAGS    = "-IC:\msys64\mingw64\include"
          $env:CGO_LDFLAGS   = "-LC:\msys64\mingw64\lib"
          $env:CC            = "C:\msys64\mingw64\bin\gcc.exe"
          $env:CXX           = "C:\msys64\mingw64\bin\g++.exe"
          New-Item -ItemType Directory -Force -Path build\bin | Out-Null
          go build -o build\bin\picpress.exe .

      - name: Build Electron (Windows)
        shell: pwsh
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: dist/*.exe
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Linux
  # ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips and electron-builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            libnss3-dev \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Go sidecar
        run: npm run build:go
        env:
          CGO_ENABLED: '1'

      - name: Build Electron (Linux)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicPress Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
