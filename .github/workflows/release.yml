name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────
  # macOS — matrix: arm64 on macos-14, x64 on macos-13
  # CGO + libvips cross-compilation is unreliable, so we use
  # native runners for each arch. The beforeBuild hook in
  # electron-builder.config.ts auto-compiles the Go sidecar.
  # ────────────────────────────────────────────────
  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-14    # Apple Silicon (arm64)
            eb_arch: --arm64
          - runner: macos-13    # Intel (x64)
            eb_arch: --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips
        run: brew install vips

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      # beforeBuild hook compiles Go sidecar for the correct arch automatically.
      - name: Build Electron (macOS)
        run: npm run build && npx electron-builder --mac dmg zip ${{ matrix.eb_arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CGO_ENABLED: '1'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install MinGW64 + libvips via MSYS2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libvips

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add MSYS2 mingw64 to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      # CGO env vars are forwarded into the beforeBuild hook via process.env inheritance.
      - name: Build Electron (Windows)
        shell: pwsh
        run: npm run build && npx electron-builder --win nsis --publish never
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: '${{ steps.msys2.outputs.msys2-location }}\mingw64\lib\pkgconfig'
          CGO_CFLAGS: '-I${{ steps.msys2.outputs.msys2-location }}\mingw64\include'
          CGO_LDFLAGS: '-L${{ steps.msys2.outputs.msys2-location }}\mingw64\lib'
          CC: 'gcc'
          CXX: 'g++'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: dist/*.exe
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Linux
  # ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libvips and electron-builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvips-dev \
            fakeroot \
            dpkg \
            rpm \
            libarchive-tools \
            libnss3-dev \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      # beforeBuild hook compiles Go sidecar automatically.
      - name: Build Electron (Linux)
        run: npm run build && npx electron-builder --linux AppImage deb --publish never
        env:
          CGO_ENABLED: '1'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PicPress Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
